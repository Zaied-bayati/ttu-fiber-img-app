syntax = "proto3";
package zen_api.acquisition.v1beta;
option csharp_namespace = "ZenApi.Acquisition.V1Beta";
import "zen_api/common/v1/int_size.proto";
import "zen_api/acquisition/v1beta/frame_position.proto";
import "zen_api/acquisition/v1beta/frame_stage_position.proto";
import "zen_api/acquisition/v1beta/scaling.proto";
import "zen_api/acquisition/v1beta/frame_pixel_data.proto";

message FrameData {
  string experiment_id = 1;
  int32 frame_number = 2;
  FramePosition frame_position = 3;
  zen_api.common.v1.IntSize frame_size = 4;
  FrameStagePosition frame_stage_position = 5;
  Scaling scaling = 6;
  FramePixelData pixel_data = 7;
}